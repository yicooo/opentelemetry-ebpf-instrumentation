file_format: "1.0"
log_level: debug
resource:
  attributes:
    - name: service.name
      value: failedconnectclient
    - name: service.namespace
      value: integration-test
    - name: host.name
      value: obi
tracer_provider:
  processors:
    - batch:
        schedule_delay: 1
        exporter:
          otlp_http:
            endpoint: http://jaeger:4318/v1/traces
            encoding: protobuf
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
        poll_interval: 500ms
      rules:
        - action: exclude
          match:
            process:
              exe_path_regex: "(?:^|/)(obi$|otelcol[^/]*$)"
        - action: exclude
          match:
            kubernetes:
              namespace_regex: "^kube-system$|^kube-node-lease$|^local-path-storage$|^cert-manager$|^monitoring$|^gke-connect$|^gke-gmp-system$|^gke-managed-cim$|^gke-managed-filestorecsi$|^gke-managed-metrics-server$|^gke-managed-system$|^gke-system$|^gke-managed-volumepopulator$|^gatekeeper-system"
        - action: exclude
          match:
            process:
              exports_otlp:
                port: 4317
                protocol: protobuf
        - action: include
          match:
            process:
              exe_path_regex: "failedconnectclient"
      runtimes:
        go:
          enabled: false
      engine:
        batching:
          batch_timeout: 10ms
        debug:
          bpf: true
      instrumentation:
        http:
          routes:
            incoming:
              unmatched: path
            outgoing:
              unmatched: path
    enrich:
      service_name:
        sources: [k8s, ecs]
    daemon:
      logging:
        debug_trace_output: text
